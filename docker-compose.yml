services:
  # Postgres embutido, só pra quem não tem um servidor próprio -- fica atrás
  # de um profile de propósito: apontando APP_DB_HOST/USER/PASSWORD/etc pro
  # seu próprio Postgres (produção, RDS, o que for), esse serviço nem
  # precisa subir. Rodar com ele: `docker compose --profile local-db up -d`
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: ${APP_DB_USER:-cnpj}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-cnpj}
      POSTGRES_DB: ${APP_DB_NAME:-cnpj}
    volumes:
      - cnpj_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:-cnpj}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      # Defaults apontam pro serviço `db` acima (profile local-db). Pra usar
      # um Postgres seu, sobrescreva no .env -- ver .env.example.
      APP_DB_HOST: ${APP_DB_HOST:-db}
      APP_DB_PORT: ${APP_DB_PORT:-5432}
      APP_DB_USER: ${APP_DB_USER:-cnpj}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-cnpj}
      APP_DB_NAME: ${APP_DB_NAME:-cnpj}
      APP_DOWNLOAD_DIR: /data/cnpj-import
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - cnpj_download_data:/data/cnpj-import

  # Roda a importação uma vez por mês (dia 20, 03:00) -- ver app/scheduler.py.
  # Pra rodar manualmente: `docker compose run --rm app python -m app.cli import-cnpj`
  scheduler:
    build: .
    restart: unless-stopped
    environment:
      APP_DB_HOST: ${APP_DB_HOST:-db}
      APP_DB_PORT: ${APP_DB_PORT:-5432}
      APP_DB_USER: ${APP_DB_USER:-cnpj}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-cnpj}
      APP_DB_NAME: ${APP_DB_NAME:-cnpj}
      APP_DOWNLOAD_DIR: /data/cnpj-import
    volumes:
      - cnpj_download_data:/data/cnpj-import
    command: ["python", "-m", "app.scheduler"]

volumes:
  cnpj_db_data:
  cnpj_download_data:
