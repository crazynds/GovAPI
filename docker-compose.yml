services:
  # Postgres embutido, só pra quem não tem um servidor próprio -- fica atrás
  # de um profile de propósito: apontando APP_DB_HOST/USER/PASSWORD/etc pro
  # seu próprio Postgres (produção, RDS, o que for), esse serviço nem
  # precisa subir. Rodar com ele: `docker compose --profile local-db up -d`
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: ${APP_DB_USER:-cnpj}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-cnpj}
      POSTGRES_DB: ${APP_DB_NAME:-cnpj}
    volumes:
      - cnpj_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:-cnpj}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      # Defaults apontam pro serviço `db` acima (profile local-db). Pra usar
      # um Postgres seu, sobrescreva no .env -- ver .env.example.
      APP_DB_HOST: ${APP_DB_HOST:-db}
      APP_DB_PORT: ${APP_DB_PORT:-5432}
      APP_DB_USER: ${APP_DB_USER:-cnpj}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-cnpj}
      APP_DB_NAME: ${APP_DB_NAME:-cnpj}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Código montado direto do host -- editar aqui já reflete no
      # container, sem rebuild. Só precisa rebuildar (`docker compose build
      # app`) quando requirements.txt mudar (dependências ficam na imagem).
      - ./app:/srv/app
      - ./alembic:/srv/alembic
      - ./alembic.ini:/srv/alembic.ini
      # Scratch de zips/CSVs do import -- some com o container, não precisa
      # de volume nomeado (ver APP_DOWNLOAD_DIR em app/config.py).

  # Job de uma vez só: preenche latitude/longitude de municípios (Nominatim)
  # e CEPs (extrato OpenStreetMap/Geofabrik) -- ver `python -m app.cli
  # geo-worker`. Sem `restart`, então ele sobe, termina e fica parado
  # (não reinicia sozinho); não sobe por padrão com `docker compose up`,
  # precisa pedir explicitamente: `docker compose up geo-worker`.
  geo-worker:
    build: .
    profiles: ["geo-worker"]
    environment:
      APP_DB_HOST: ${APP_DB_HOST:-db}
      APP_DB_PORT: ${APP_DB_PORT:-5432}
      APP_DB_USER: ${APP_DB_USER:-cnpj}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-cnpj}
      APP_DB_NAME: ${APP_DB_NAME:-cnpj}
    volumes:
      - ./app:/srv/app
      - ./alembic:/srv/alembic
      - ./alembic.ini:/srv/alembic.ini
    command: ["python", "-m", "app.cli", "geo-worker"]

volumes:
  cnpj_db_data:
